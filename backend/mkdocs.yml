site_name: PiedraAzul
site_description: Documentación del monolito modular PiedraAzul (Spring Boot + Angular)
site_url: http://localhost:8000/

repo_name: piedra-azul
# repo_url: https://github.com/...

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro

nav:
  - Inicio: index.md
  - Arquitectura: arquitectura.md
  - Módulos:
      - Vista general: modulos.md
      - Núcleo común: nucleo.md
      - Identidad y acceso: identidad.md
      - Personas: personas.md
      - Disponibilidad: disponibilidad.md
      - Citas: citas.md
  - Seguridad (JWT): seguridad.md
  - Frontend (Angular): frontend.md
  - API: api/index.md
  - Pruebas: pruebas.md
  - Diagramas de clases:
      - Índice: diagramas/index.md
      - Núcleo: diagramas/01-nucleo.md
      - Identidad: diagramas/02-identidad.md
      - Personas: diagramas/03-personas.md
      - Disponibilidad: diagramas/04-disponibilidad.md
      - Citas: diagramas/05-citas.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - plantuml_markdown:
      server: https://www.plantuml.com/plantuml
      format: svg
      classes: plantuml-diagrama

extra_javascript:
  - javascripts/mermaid-config.js

extra_css:
  - stylesheets/extra.css

docs_dir: docs
site_dir: site
