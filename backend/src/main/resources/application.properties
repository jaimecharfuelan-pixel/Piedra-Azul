spring.application.name=piedra-azul-backend

server.port=8080

# Perfil por defecto: H2 en memoria (desarrollo local sin Docker).
# Con Docker se activa el perfil "docker" → PostgreSQL.
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Fechas y horas viajan siempre como ISO-8601 (yyyy-MM-dd, HH:mm), no como timestamps.
spring.jackson.serialization.write-dates-as-timestamps=false

# Proveedor de identidad: "keycloak" (RNF1 / Docker) o "local" (tests / dev sin contenedor).
app.security.provider=${APP_SECURITY_PROVIDER:local}

# Emisor local (Nimbus HS256). Solo aplica con provider=local.
app.security.jwt.secret=${JWT_SECRET:cGllZHJhYXp1bC1qd3Qtc2VjcmV0LWNsYXZlLWRldjIwMjYtY2FtYmlhci1lbi1wcm9k}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.jwt.issuer=${JWT_ISSUER:http://localhost/local-piedraazul}

# Keycloak (RNF1). Activo con provider=keycloak.
app.security.keycloak.server-url=${APP_KEYCLOAK_SERVER_URL:http://localhost:8180}
app.security.keycloak.issuer-uri=${APP_KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/piedraazul}
app.security.keycloak.jwk-set-uri=${APP_KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/piedraazul/protocol/openid-connect/certs}
app.security.keycloak.realm=${APP_KEYCLOAK_REALM:piedraazul}
app.security.keycloak.client-id=${APP_KEYCLOAK_CLIENT_ID:piedraazul-backend}
app.security.keycloak.client-secret=${APP_KEYCLOAK_CLIENT_SECRET:}
app.security.keycloak.admin-username=${APP_KEYCLOAK_ADMIN_USERNAME:admin}
app.security.keycloak.admin-password=${APP_KEYCLOAK_ADMIN_PASSWORD:admin}

# Datos de demostración (especialidades, médicos, pacientes, horarios y citas de ejemplo).
# Sólo siembra si la base está vacía. Poner en false para arrancar sin datos.
app.seed.enabled=${APP_SEED_ENABLED:true}
