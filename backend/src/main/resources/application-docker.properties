# Perfil Docker: PostgreSQL (JPA crear/actualizar el esquema)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/piedraazul}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:piedraazul}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:piedraazul}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# En el contenedor el SQL de Hibernate tapa los mensajes propios de la aplicación.
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Sólo el health, que es lo que consulta el healthcheck de Docker Compose.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
