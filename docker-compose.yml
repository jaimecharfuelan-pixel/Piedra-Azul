services:
  db:
    image: postgres:16-alpine
    container_name: piedraazul-db
    environment:
      POSTGRES_DB: piedraazul
      POSTGRES_USER: piedraazul
      POSTGRES_PASSWORD: piedraazul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts SQL de datos de prueba (se ejecutan solo al crear el volumen por primera vez)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piedraazul -d piedraazul"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: piedraazul-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/piedraazul
      SPRING_DATASOURCE_USERNAME: piedraazul
      SPRING_DATASOURCE_PASSWORD: piedraazul
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: piedraazul-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
